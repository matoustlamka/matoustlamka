<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-label="Matouš Tlamka — logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B0605"/>
    <stop offset="0.55" stop-color="#14090A"/>
    <stop offset="1" stop-color="#1C0C06"/>
  </linearGradient>

  <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FF9E1B" stop-opacity="0.95"/>
    <stop offset="0.45" stop-color="#FF2D00" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#5E1300" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
    <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
  </radialGradient>

  <linearGradient id="molten" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="360.0" y2="0">
    <stop offset="0" stop-color="#5E1300"/>
    <stop offset="0.25" stop-color="#FF2D00"/>
    <stop offset="0.5" stop-color="#FFD36E"/>
    <stop offset="0.75" stop-color="#FF6A00"/>
    <stop offset="1" stop-color="#5E1300"/>
    <animateTransform attributeName="gradientTransform" type="translate"
      values="-360.0 0; 360.0 0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>

  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <filter id="tglow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#FF3D00" flood-opacity="0.55"/>
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#170603" flood-opacity="0.9"/>
  </filter>

  <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>

  <filter id="magma" x="-25%" y="-25%" width="150%" height="150%">
    <feTurbulence type="fractalNoise" baseFrequency="0.009 0.016" numOctaves="4" seed="7" result="n">
      <animate attributeName="baseFrequency" dur="22s" repeatCount="indefinite"
        values="0.009 0.016; 0.014 0.022; 0.007 0.013; 0.009 0.016"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="46" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="11"/>
  </filter>

  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="3"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
  </filter>

  <linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="68.4" y1="83.7" x2="291.6" y2="276.3">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.44" stop-color="#FFFFFF"/>
    <stop offset="0.5" stop-color="#FF9E1B">
      <animate attributeName="offset" values="-0.3;1.3" dur="4.5s" repeatCount="indefinite"/>
    </stop>
    <stop offset="0.56" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#FFFFFF"/>
  </linearGradient>
  <clipPath id="round"><rect width="360" height="360" rx="50"/></clipPath>
  <style>
    .gl{animation-name:glyphIn;animation-duration:.85s;animation-timing-function:cubic-bezier(.2,.85,.25,1);animation-fill-mode:both}
    .crack{animation-name:flow;animation-timing-function:linear;animation-iteration-count:infinite}
    .ember{animation-name:rise;animation-timing-function:ease-out;animation-iteration-count:infinite;opacity:0}
    .chip{animation:fadeUp .9s ease-out both}
    .logo{animation:logoIn 1.5s cubic-bezier(.16,1,.3,1) both}
    .halo{animation:breathe 4.2s ease-in-out infinite}
    .spinS{animation:spin 34s linear infinite}
    .spinR{animation:spinr 52s linear infinite}
    .line{animation:grow 1.4s cubic-bezier(.16,1,.3,1) both}
    @keyframes glyphIn{0%{opacity:0;transform:translateY(26px) scale(.92)}70%{opacity:1}100%{opacity:1;transform:none}}
    @keyframes flow{to{stroke-dashoffset:-1200}}
    @keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.5)}
      12%{opacity:.95}
      70%{opacity:.8}
      100%{opacity:0;transform:translate(var(--dx),var(--rise)) scale(1.25)}}
    @keyframes fadeUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
    @keyframes logoIn{0%{opacity:0;transform:translateY(18px) scale(.86) rotate(-6deg)}100%{opacity:1;transform:none}}
    @keyframes breathe{0%,100%{opacity:.30}50%{opacity:.85}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes spinr{to{transform:rotate(-360deg)}}
    @keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
    @keyframes dash{to{stroke-dashoffset:0}}
</style>
</defs>
<g clip-path="url(#round)">
  <rect width="360" height="360" fill="url(#bg)"/>
  <g filter="url(#magma)" opacity="0.34">
<ellipse cx="178.1" cy="234.4" rx="95.7" ry="92.5" fill="#FF2D00" opacity="0.42"><animateTransform attributeName="transform" type="translate" dur="17.2s" values="0 0; 14.7 -4.6; 0 0" repeatCount="indefinite"/><animate attributeName="opacity" dur="8.6s" values="0.18;0.48;0.18" repeatCount="indefinite"/></ellipse>
<ellipse cx="131.4" cy="185.4" rx="64.6" ry="79.3" fill="#3D0A00" opacity="0.42"><animateTransform attributeName="transform" type="translate" dur="21.2s" values="0 0; 29.9 4.3; 0 0" repeatCount="indefinite"/><animate attributeName="opacity" dur="10.6s" values="0.18;0.48;0.18" repeatCount="indefinite"/></ellipse>
<ellipse cx="226.6" cy="163.4" rx="71.3" ry="77.3" fill="#FF6A00" opacity="0.42"><animateTransform attributeName="transform" type="translate" dur="22.5s" values="0 0; -15.5 -13.2; 0 0" repeatCount="indefinite"/><animate attributeName="opacity" dur="11.2s" values="0.18;0.48;0.18" repeatCount="indefinite"/></ellipse>
<ellipse cx="346.1" cy="164.3" rx="106.6" ry="118.2" fill="#FF2D00" opacity="0.42"><animateTransform attributeName="transform" type="translate" dur="22.9s" values="0 0; 9.7 -18.1; 0 0" repeatCount="indefinite"/><animate attributeName="opacity" dur="11.4s" values="0.18;0.48;0.18" repeatCount="indefinite"/></ellipse>
<ellipse cx="253.6" cy="137.8" rx="69.6" ry="76.1" fill="#3D0A00" opacity="0.42"><animateTransform attributeName="transform" type="translate" dur="13.8s" values="0 0; -10.1 -25.4; 0 0" repeatCount="indefinite"/><animate attributeName="opacity" dur="6.9s" values="0.18;0.48;0.18" repeatCount="indefinite"/></ellipse>
</g>
  <rect width="360" height="360" fill="#0B0605" opacity="0.45"/>
  <ellipse class="halo" cx="180.0" cy="180.0" rx="158" ry="144" fill="url(#core)" opacity="0.7"/>
  <g filter="url(#glow)">
<circle class="ember" cx="30.0" cy="390.6" r="2.9" fill="#FF9E1B" style="animation-duration:9.3s;animation-delay:-13.2s;--dx:-6px;--rise:-430px"/>
<circle class="ember" cx="222.9" cy="396.8" r="1.3" fill="#FFD36E" style="animation-duration:6.3s;animation-delay:-2.5s;--dx:-37px;--rise:-430px"/>
<circle class="ember" cx="158.6" cy="364.9" r="1.1" fill="#FF6A00" style="animation-duration:8.5s;animation-delay:-5.6s;--dx:31px;--rise:-430px"/>
<circle class="ember" cx="8.1" cy="386.0" r="2.8" fill="#FF9E1B" style="animation-duration:11.9s;animation-delay:-2.2s;--dx:-28px;--rise:-430px"/>
<circle class="ember" cx="134.5" cy="360.3" r="2.9" fill="#FFD36E" style="animation-duration:12.1s;animation-delay:-11.3s;--dx:12px;--rise:-430px"/>
<circle class="ember" cx="351.7" cy="375.6" r="1.0" fill="#FF6A00" style="animation-duration:8.9s;animation-delay:-6.1s;--dx:25px;--rise:-430px"/>
<circle class="ember" cx="4.6" cy="394.2" r="1.6" fill="#FF9E1B" style="animation-duration:6.2s;animation-delay:-8.5s;--dx:30px;--rise:-430px"/>
<circle class="ember" cx="218.1" cy="389.4" r="1.8" fill="#FFD36E" style="animation-duration:9.2s;animation-delay:-0.3s;--dx:30px;--rise:-430px"/>
<circle class="ember" cx="206.4" cy="365.4" r="1.3" fill="#FF6A00" style="animation-duration:10.3s;animation-delay:-9.7s;--dx:36px;--rise:-430px"/>
<circle class="ember" cx="154.3" cy="381.9" r="2.4" fill="#FF9E1B" style="animation-duration:6.5s;animation-delay:-13.5s;--dx:-9px;--rise:-430px"/>
<circle class="ember" cx="351.3" cy="395.0" r="2.7" fill="#FFD36E" style="animation-duration:7.1s;animation-delay:-6.4s;--dx:-1px;--rise:-430px"/>
<circle class="ember" cx="114.4" cy="379.3" r="1.5" fill="#FF6A00" style="animation-duration:10.7s;animation-delay:-10.0s;--dx:14px;--rise:-430px"/>
</g>
  <rect width="360" height="360" fill="url(#vig)"/>
  <g class="spinS" style="transform-origin:180.0px 180.0px">
    <circle cx="180.0" cy="180.0" r="151" fill="none" stroke="url(#molten)" stroke-width="1.2" stroke-dasharray="4 14"/>
  </g>
  <g class="spinR" style="transform-origin:180.0px 180.0px" opacity="0.5">
    <circle cx="180.0" cy="180.0" r="169" fill="none" stroke="#FF6A00" stroke-width="0.9" stroke-dasharray="1 22"/>
  </g>
  <g class="logo" transform="translate(68.4,83.7) scale(0.18600)">
